<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WGIS - 2단계 맥락 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="stage2-preview.css" />
</head>
<body>
  <div class="preview-shell">
    <aside class="preview-sidebar">
      <header class="preview-header">
        <a class="back-link" href="stage1.html">1단계 기본 지도로 이동</a>
        <div class="eyebrow">WGIS Main</div>
        <h1>2단계 맥락 지도</h1>
        <p>역사 맥락, 사용자용 필터, 출처 신뢰도를 함께 보며 세계사 지점을 다각도로 비교합니다.</p>
      </header>

      <section class="compare-panel" aria-label="1단계와 2단계 비교">
        <div>
          <strong>1단계</strong>
          <span>기본 지도와 단순 검색 보조 화면</span>
        </div>
        <div>
          <strong>2단계</strong>
          <span>메인 화면: 맥락, 필터, 출처 신뢰도 중심</span>
        </div>
      </section>

      <section class="control-panel" aria-label="2단계 맥락 지도 검색과 필터">
        <label class="search-label" for="datasetSelect">
          <span>데이터셋</span>
          <select id="datasetSelect"></select>
        </label>
        <label class="search-label" for="stage2Search">
          <span>검색</span>
          <input id="stage2Search" type="search" placeholder="예: 루시, 바스티유, 직립보행, 공화국" autocomplete="off" />
        </label>
        <div class="filter-block">
          <span class="filter-label">역사 맥락</span>
          <div id="contextFilters" class="chip-row"></div>
        </div>
      </section>

      <section class="entry-panel" aria-label="항목 목록">
        <div class="entry-panel-header">
          <strong>지도 항목</strong>
          <span id="entryCount">0개</span>
        </div>
        <div id="entryList" class="entry-list"></div>
      </section>
    </aside>

    <main class="preview-main">
      <div id="stage2Map" class="stage2-map" aria-label="2단계 맥락 지도"></div>
      <section id="detailPanel" class="detail-panel" aria-live="polite"></section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="stage2-preview.js"></script>
</body>
</html>
