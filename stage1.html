<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WGIS 1단계 기본 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="search-panel">
      <button id="mobileSheetToggle" class="mobile-sheet-handle" type="button" aria-expanded="false" aria-controls="resultsList">
        <span class="sheet-grip" aria-hidden="true"></span>
        <span class="sheet-label">검색 및 결과</span>
      </button>

      <header class="app-header">
        <div class="eyebrow">WGIS</div>
        <h1>World Geometry Information System</h1>
        <p>과거 지명, 사건, 유물과 유적을 검색하면 현재의 지역명과 위치를 확인합니다.</p>
        <a class="stage2-preview-entry" href="/">2단계 메인으로 이동</a>
      </header>

      <section class="search-section" aria-label="검색">
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="예: 서라벌, 장안, 콘스탄티노폴리스, 임진왜란" autocomplete="off" />
          <button id="searchButton" type="button">검색</button>
          <button id="clearSearchBtn" type="button" title="검색어 지우기">×</button>
        </div>
        <div class="filter-toolbar">
          <button id="filterPanelBtn" class="filter-panel-btn" type="button" aria-expanded="false" aria-controls="filterPanel">
            필터
          </button>
          <span id="activeFilterSummary" class="active-filter-summary">전체 · 전 세계</span>
        </div>

        <div id="filterPanel" class="filter-panel" hidden>
          <div class="filter-panel-header">
            <strong>검색 필터</strong>
            <button id="filterPanelCloseBtn" class="filter-panel-close" type="button" aria-label="필터 닫기">×</button>
          </div>
          <div class="filter-panel-group">
            <span class="filter-panel-label">유형</span>
            <div class="filter-row" id="typeFilters"></div>
          </div>
          <div class="filter-panel-group">
            <span class="filter-panel-label">권역</span>
            <div class="filter-row compact" id="regionFilters"></div>
          </div>
        </div>
      </section>

      <section class="summary-strip" aria-label="검색 요약">
        <div>
          <span class="metric" id="resultCount">0</span>
          <span class="metric-label">검색 결과</span>
        </div>
        <div>
          <span class="metric" id="visibleCountries">0</span>
          <span class="metric-label">현재 국가</span>
        </div>
      </section>

      <section class="mobile-detail-section" id="mobileDetail" aria-live="polite" hidden></section>

      <section class="pagination-bar" aria-label="목록 페이지">
        <label class="page-size-control" for="pageSizeSelect">
          목록
          <select id="pageSizeSelect">
            <option value="10">10개</option>
            <option value="20">20개</option>
            <option value="30">30개</option>
            <option value="50">50개</option>
          </select>
        </label>
        <span class="page-status" id="pageStatus">0 / 0</span>
        <div class="page-actions">
          <button id="prevPageBtn" type="button" aria-label="이전 페이지">‹</button>
          <button id="nextPageBtn" type="button" aria-label="다음 페이지">›</button>
        </div>
      </section>

      <section class="results-section" aria-label="검색 결과">
        <div id="resultsList" class="results-list"></div>
      </section>
    </aside>

    <main class="map-panel">
      <div id="map"></div>
      <section class="detail-drawer" id="detailDrawer" aria-live="polite">
        <div class="empty-detail">
          <span class="empty-title">검색하거나 결과를 선택하세요</span>
          <span class="empty-copy">현재 지명, 좌표, 과거 명칭과 맥락이 여기에 표시됩니다.</span>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
